<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDN</title>
  <meta name="description" content="A personal CDN for assets.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/avatars/favicon.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Hey, this is my CDN.</h1>
    <p>
      Assets for my other sites. Meant for me, but you're welcome to look around.
    </p>
    <p class="note">
      Please don't hotlink. I can change these URLs at any point without
      warning, so anything pointing here may break.
    </p>

    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="folderbar" id="folderbar"></div>
    <input class="filter" id="filter" type="search" placeholder="Filter this folder…" autocomplete="off">
    <ul class="listing" id="listing"></ul>

    <footer id="footer">
      <span id="fcount"></span>
      <a href="/licence.html">Licence</a>
    </footer>
  </main>
  <script src="/script.js"></script>
</body>
</html>
